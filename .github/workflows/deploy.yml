# Sample workflow for building and deploying a React application to GitHub Pages
name: Deploy Wordle to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Cancel outdated runs so the latest version can be deployed.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # Checks out the repository
      - name: Checkout
        uses: actions/checkout@v6

      # Sets up Node.js for the React application
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Installs project dependencies
      - name: Install dependencies
        run: npm ci

      # Builds the React application
      - name: Build React application
        run: npm run build

      # Uploads the generated build files as a GitHub Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    # Sets permissions required for GitHub Pages deployment
    permissions:
      pages: write
      id-token: write

    steps:
      # Deploys the uploaded artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
